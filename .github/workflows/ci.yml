name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  backend:
    name: FastAPI pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  edge:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run Edge Function tests
        run: node --test supabase/functions/mentor-ai/*.test.mjs backend/tests/test_gemini_key_pool.mjs backend/tests/test_mentor_ai_handler.mjs

  sql:
    name: Isolated Supabase migrations and SQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Start disposable local Supabase
        run: supabase start
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run rollback-only SQL smoke tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          for script in supabase/tests/*_smoke.sql; do
            psql -X --set ON_ERROR_STOP=1 -f "$script"
          done
