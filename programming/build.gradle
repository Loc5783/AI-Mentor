plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.modulelaptrinh'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        buildConfigField "String", "PROGRAMMING_CHAT_GEMINI_API_KEY_1", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_CHAT_GEMINI_API_KEY_1") ?: "").toString())
        buildConfigField "String", "PROGRAMMING_CHAT_GEMINI_API_KEY_2", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_CHAT_GEMINI_API_KEY_2") ?: "").toString())
        buildConfigField "String", "PROGRAMMING_CHAT_GEMINI_API_KEY_3", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_CHAT_GEMINI_API_KEY_3") ?: "").toString())
        buildConfigField "String", "PROGRAMMING_QUIZ_GEMINI_API_KEY_1", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_QUIZ_GEMINI_API_KEY_1") ?: "").toString())
        buildConfigField "String", "PROGRAMMING_QUIZ_GEMINI_API_KEY_2", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_QUIZ_GEMINI_API_KEY_2") ?: "").toString())
        buildConfigField "String", "PROGRAMMING_QUIZ_GEMINI_API_KEY_3", groovy.json.JsonOutput.toJson((project.findProperty("PROGRAMMING_QUIZ_GEMINI_API_KEY_3") ?: "").toString())

        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
