plugins {
    id 'com.android.library'
}

android {
    namespace 'com.brightpath.science'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        buildConfigField "String", "SCIENCE_GEMINI_API_KEY_1", groovy.json.JsonOutput.toJson((project.findProperty("SCIENCE_GEMINI_API_KEY_1") ?: "").toString())
        buildConfigField "String", "SCIENCE_GEMINI_API_KEY_2", groovy.json.JsonOutput.toJson((project.findProperty("SCIENCE_GEMINI_API_KEY_2") ?: "").toString())
        buildConfigField "String", "SCIENCE_GEMINI_API_KEY_3", groovy.json.JsonOutput.toJson((project.findProperty("SCIENCE_GEMINI_API_KEY_3") ?: "").toString())

        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
