plugins {
    id 'com.android.library'
}

def apiProperties = new Properties()
def apiPropertiesFile = rootProject.file('api.properties')
if (apiPropertiesFile.exists()) {
    apiPropertiesFile.withInputStream { stream -> apiProperties.load(stream) }
}

def quotedBuildConfigValue = { String value ->
    String safe = (value ?: '').replace('\\', '\\\\').replace('"', '\\"')
    return '"' + safe + '"'
}

android {
    namespace 'com.brightpath.science'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // Science API secrets are read from api.properties at build time.
        // They are no longer hard-coded in Java source.
        buildConfigField 'String', 'SCIENCE_GEMINI_API_KEY_1',
                quotedBuildConfigValue(apiProperties.getProperty('SCIENCE_GEMINI_API_KEY_1', ''))
        buildConfigField 'String', 'SCIENCE_GEMINI_API_KEY_2',
                quotedBuildConfigValue(apiProperties.getProperty('SCIENCE_GEMINI_API_KEY_2', ''))
        buildConfigField 'String', 'SCIENCE_GEMINI_API_KEY_3',
                quotedBuildConfigValue(apiProperties.getProperty('SCIENCE_GEMINI_API_KEY_3', ''))
        buildConfigField 'String', 'SCIENCE_GEMINI_MODEL',
                quotedBuildConfigValue(apiProperties.getProperty('SCIENCE_GEMINI_MODEL', 'gemini-flash-latest'))
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':data-core')
    implementation project(':ui-core')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
